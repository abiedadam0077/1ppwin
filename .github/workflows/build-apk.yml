name: Build APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/build-apk.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/build-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Resolve dependencies
        id: dependencies
        run: |
          mkdir -p .ci
          flutter pub get --enforce-lockfile 2>&1 | tee .ci/pub-get.log

      - name: Analyze & test
        run: |
          # Run both checks, but preserve their exit codes rather than hiding failures.
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee .ci/analyze.log
          analyze_status=$?
          flutter test --reporter expanded 2>&1 | tee .ci/test.log
          test_status=$?
          if [ "$analyze_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Report check results
        if: ${{ always() }}
        env:
          BUILD_STATUS: ${{ job.status }}
        run: python3 .github/scripts/report-build-diagnostics.py

      - name: Build release APK
        # Compile and publish only after the analyzer and tests both pass.
        run: |
          flutter build apk --release 2>&1 | tee .ci/build.log
          cp build/app/outputs/flutter-apk/app-release.apk NOVA-Windows-Cloud.apk
          sha256sum NOVA-Windows-Cloud.apk > NOVA-Windows-Cloud.apk.sha256

      - name: Report build diagnostics
        if: ${{ always() }}
        env:
          BUILD_STATUS: ${{ job.status }}
        run: python3 .github/scripts/report-build-diagnostics.py

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            .ci/*.log
            pubspec.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows-Cloud-APK
          path: |
            NOVA-Windows-Cloud.apk
            NOVA-Windows-Cloud.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: "NOVA Windows Cloud — latest APK"
          body: |
            Direct download: **NOVA-Windows-Cloud.apk** below.
            Built and tested automatically from commit `${{ github.sha }}` on main.
            SHA-256 checksum: **NOVA-Windows-Cloud.apk.sha256**.
          files: |
            NOVA-Windows-Cloud.apk
            NOVA-Windows-Cloud.apk.sha256
          fail_on_unmatched_files: true
          prerelease: true
