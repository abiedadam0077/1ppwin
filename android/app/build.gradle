plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def releaseTaskRequested = requestedTasks.any { taskName ->
    taskName.contains("release") || taskName == "assemble" || taskName == "build" ||
        taskName.endsWith(":assemble") || taskName.endsWith(":build")
}

def releaseKeystorePath = System.getenv("NOVA_RELEASE_KEYSTORE_PATH")?.trim()
def releaseStorePassword = System.getenv("NOVA_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("NOVA_RELEASE_KEY_ALIAS")?.trim()
def releaseKeyPassword = System.getenv("NOVA_RELEASE_KEY_PASSWORD")

if (releaseTaskRequested) {
    def missingSigningValues = []
    if (!releaseKeystorePath) missingSigningValues << "NOVA_RELEASE_KEYSTORE_PATH"
    if (!releaseStorePassword) missingSigningValues << "NOVA_RELEASE_STORE_PASSWORD"
    if (!releaseKeyAlias) missingSigningValues << "NOVA_RELEASE_KEY_ALIAS"
    if (!releaseKeyPassword) missingSigningValues << "NOVA_RELEASE_KEY_PASSWORD"

    if (!missingSigningValues.isEmpty()) {
        throw new GradleException(
            "Release signing is mandatory. Missing environment variable(s): " +
                missingSigningValues.join(", ") +
                ". Configure the persistent nova_release keystore; unsigned/debug-signed release APKs are disabled."
        )
    }
    if (releaseKeyAlias != "nova_release") {
        throw new GradleException("NOVA_RELEASE_KEY_ALIAS must be exactly nova_release.")
    }
    if (!file(releaseKeystorePath).isFile()) {
        throw new GradleException(
            "Release signing keystore was not found at NOVA_RELEASE_KEYSTORE_PATH. " +
                "No release APK will be produced."
        )
    }
}

android {
    namespace = "app.nova.windowscloud"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "app.nova.windowscloud"
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // A missing key never falls back to the debug signing config.
            storeFile = file(releaseKeystorePath ?: "${buildDir}/missing-release-key.jks")
            storePassword = releaseStorePassword ?: ""
            keyAlias = releaseKeyAlias ?: ""
            keyPassword = releaseKeyPassword ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
