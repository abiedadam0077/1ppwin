name: nova_windows_cloud
description: NOVA Windows Cloud — control panel for Windows 11 Pro on GitHub Actions.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  # 6.4.x uses a Gradle Flutter extension unavailable in Flutter 3.24.
  app_links: 6.3.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  pinenacl: ^0.6.0
  google_fonts: ^6.2.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/windows11.yml
    - assets/minecraft-cloud.yml
    - assets/nova_windows_bloom.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
